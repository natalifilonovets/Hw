<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171325"><title>Johnny's Halloween Time Machine</title><link rel="stylesheet" href="styles.css"></head><body>
<main id="game" aria-label="Johnny's Halloween Time Machine">
<div id="backdrop" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div><div class="motes" aria-hidden="true"></div>
<header><a class="brand" href="#" id="home" aria-label="Return to the ancient festival"><span class="brand-mark">J</span><span>JOHNNY'S<br><strong>TIME MACHINE</strong></span></a><nav aria-label="Game controls"><button id="sound" aria-label="Enable speech">SOUND OFF</button><button id="motion" aria-label="Reduce animation">MOTION ON</button><button id="help" aria-label="Help">?</button><button id="restart" aria-label="Restart adventure">↻</button></nav></header>
<div id="progress" aria-label="Adventure progress"></div><div id="bag" aria-live="polite"></div>
<section id="scene" aria-labelledby="scene-title"></section>
<div id="speech" aria-live="polite"></div><div id="toast" role="status" aria-live="polite"></div>
<footer><button id="back">← BACK</button><span>A LITTLE HISTORY. A LOT OF HALLOWEEN.</span><span id="saved">AUTOSAVED</span></footer>
</main>
<dialog id="modal"><button id="close-modal" class="close" aria-label="Close"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" focusable="false"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><div id="modal-content"></div></dialog>
<script src="config.js"></script><script src="street-data.js"></script><script src="engine.js"></script><script src="village.js"></script><script src="street.js"></script><script src="game.js"></script>
</body></html>
